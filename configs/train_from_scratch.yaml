# Configuration for training Prophet from scratch
# This is the main configuration for training new Prophet models

# === DATA CONFIGURATION ===
data:
  data_path: "./data/my_dataset.csv"
  iv_embeddings: ["./embeddings/drug_embeddings.csv"]
  cl_embeddings: ["./embeddings/cell_embeddings.csv"]
  ph_embeddings: null
  
  iv_cols: ["iv1", "iv2"]
  cl_col: "cell_line"
  ph_col: "phenotype"
  readout_col: "value"

# === TRAINING MODE ===
mode: "scratch"
checkpoint_path: null

# === SPLITTING STRATEGY ===
splitting:
  method: "random"
  val_fraction: 0.15
  n_splits: 5
  run_cv: false

# === RANDOMIZATION ===
random_seed: 42

# === OUTPUT ===
output_dir: "./trained_models"

# === MODEL CONFIGURATION ===
# Training hyperparameters
max_steps: 50000
batch_size: 512
early_stopping: true
patience: 20
pert_len: 2

# Transformer architecture configuration
Transformer:
  # Model dimensions
  dim_cl: 300      # Cell line embedding dimension
  dim_iv: 500      # Intervention embedding dimension  
  dim_phe: 300     # Phenotype embedding dimension
  model_dim: 256   # Hidden model dimension
  
  # Architecture
  num_heads: 8     # Number of attention heads
  num_layers: 4    # Number of transformer layers
  simpler: false   # Use simplified architecture (fewer components)
  
  # Training parameters
  lr: 1e-4         # Learning rate
  weight_decay: 0.01
  warmup: 5000     # Warmup steps for learning rate
  max_iters: 50000 # Maximum training iterations
  
  # Dropout rates
  iv_dropout: 0.1
  cl_dropout: 0.1
  ph_dropout: 0.1
  regressor_dropout: 0.1
  dropout: 0.1
  
  # Other settings
  pool: cls        # Pooling strategy
  mask: true       # Use attention masking
  sum: false       # Use sum pooling
  explicit_phenotype: false  # Use explicit phenotype embeddings
  linear_predictor: false
  tokenizer_layers: 2
