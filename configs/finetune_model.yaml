# Configuration for fine-tuning existing Prophet models
# Use this when you want to adapt a pre-trained model to new data

# === DATA CONFIGURATION ===
data:
  data_path: "./data/new_domain_data.csv"
  iv_embeddings: ["./embeddings/drug_embeddings.csv"]
  cl_embeddings: ["./embeddings/cell_embeddings.csv"]
  ph_embeddings: null
  
  iv_cols: ["iv1", "iv2"]
  cl_col: "cell_line"
  ph_col: "phenotype"
  readout_col: "value"

# === TRAINING MODE ===
mode: "finetune"
checkpoint_path: "./pretrained_models/prophet_base.ckpt"  # Required for fine-tuning

# === SPLITTING STRATEGY ===
splitting:
  method: "random"               # Simple random split for fine-tuning
  val_fraction: 0.2              # Larger validation set for fine-tuning
  n_splits: 1
  run_cv: false

# === RANDOMIZATION ===
random_seed: 42

# === OUTPUT ===
output_dir: "./finetuned_models"

# === MODEL CONFIGURATION ===
# Training hyperparameters (typically smaller for fine-tuning)
max_steps: 10000
batch_size: 256
early_stopping: true
patience: 10
pert_len: 2

# Transformer configuration (reduced for fine-tuning)
Transformer:
  # Note: Model architecture should match the pre-trained model
  # Only training parameters are typically adjusted for fine-tuning
  
  # Reduced learning rate for fine-tuning
  lr: 1e-5         # Lower learning rate than training from scratch
  weight_decay: 1e-6
  warmup: 1000     # Shorter warmup
  max_iters: 10000 # Fewer iterations
  
  # Reduced dropout for fine-tuning
  iv_dropout: 0.05
  cl_dropout: 0.05
  ph_dropout: 0.05
  regressor_dropout: 0.05
  dropout: 0.05
  
  # Architecture parameters (should match pre-trained model)
  dim_cl: 300
  dim_iv: 500
  dim_phe: 300
  model_dim: 256
  num_heads: 8
  num_layers: 4
  simpler: false
  pool: cls
  mask: true
  sum: false
  explicit_phenotype: false
  linear_predictor: false
  tokenizer_layers: 2
